<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Contact</title>
</head>
<body data-page="contact">
  <main>
    <section class="contact">
      <!-- Text comes from content/contact.json (edit it in the online editor). -->
      <div class="contact-info" id="contact-intro"></div>

      <form class="form" id="contact-form">
        <div class="form-row">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <label for="subject">I'm interested in</label>
          <select id="subject" name="subject"></select>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="button" type="submit">Send</button>
        <p class="form-status" role="status"></p>
      </form>
    </section>
  </main>
  <script src="js/site.js"></script>
</body>
</html>
