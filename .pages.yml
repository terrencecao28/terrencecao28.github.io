# Settings for the online editor (Pages CMS — https://app.pagescms.org).
# This tells the editor which parts of the website you can change.

media:
  input: images
  output: /images
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif, avif]

content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
        required: true
        description: Shown in the header, footer, browser tab and in the centre of the home page.
      - name: tagline
        label: Tagline
        type: string
        description: Small text next to your name in the header, e.g. "Photography".
      - name: description
        label: Site description
        type: text
        description: A sentence about you, shown in Google search results.
      - name: email
        label: Your email
        type: string
        description: Contact form messages are sent here. The very first message triggers a confirmation email from FormSubmit. Click the link in it once to start receiving messages.
      - name: instagram
        label: Instagram link
        type: string
        description: Your full Instagram address, e.g. https://instagram.com/yourhandle. Leave empty to hide the Instagram button.
      - name: web3formsKey
        label: Contact form key (Web3Forms)
        type: string
        description: The access key from web3forms.com. Contact form messages are emailed to the address you used there.
      - name: formEndpoint
        label: Custom form address (optional)
        type: string
        description: Leave empty. Only fill this in if you use a different form service such as Formspree.

  - name: home
    label: Home page
    type: file
    path: content/home.json
    format: json
    fields:
      - name: photos
        label: Home page photos
        type: image
        description: Choose up to 6 photos (3 each side of your logo). Photos are shown uncropped. Leave empty to use your galleries' cover photos instead.
        options:
          multiple:
            max: 6
      - name: coverGalleries
        label: Use cover photos from these galleries
        type: string
        list: true
        description: When no photos are chosen above, the home page shows the cover photos of these galleries in a random order. Type gallery names exactly. Leave empty to use all galleries.
      - name: signature
        label: Signature image (optional)
        type: image
        description: An image of your signature or logo for the centre of the home page. A white signature on a transparent PNG looks best. Leave empty to show your name in a handwritten font.

  - name: galleries
    label: Galleries
    type: file
    path: content/galleries.json
    format: json
    fields:
      - name: galleries
        label: Galleries
        type: object
        description: Each gallery becomes a tile on the Galleries page. Drag to reorder.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: cover
            label: Cover photo
            type: image
            description: The photo on this gallery's tile. Leave empty to use the first photo.
          - name: photos
            label: Photos
            type: image
            description: Add as many as you like. Drag to change the order.
            options:
              multiple:
                max: 500

  - name: about
    label: About page
    type: file
    path: content/about.json
    format: json
    fields:
      - name: portrait
        label: Your portrait
        type: image
      - name: headline
        label: Headline
        type: string
      - name: bio
        label: Bio
        type: text
      - name: awardsHeading
        label: Awards heading
        type: string
      - name: awards
        label: Awards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        description: Each award gets a row with a spot for the organization's logo. Drag to reorder. Remove them all to hide the section.
        fields:
          - name: title
            label: Contest or award
            type: string
          - name: details
            label: Results
            type: string
            description: e.g. 1x 2nd, 1x 3rd, 4x HM
          - name: year
            label: Year (optional)
            type: string
          - name: logo
            label: Organization logo
            type: image
            description: Shown on a small white square, so any logo works.
          - name: link
            label: Website link
            type: string
            description: Clicking the logo opens this page in a new tab. Leave empty for no link.
      - name: buttonText
        label: Button text
        type: string
        description: The button that links to your Contact page. Leave empty to hide it.

  - name: contact
    label: Contact page
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: photo
        label: Photo
        type: image
        description: Shown under your intro text. Leave empty to hide it.
      - name: headline
        label: Headline
        type: string
      - name: intro
        label: Intro text
        type: text
        description: Leave a blank line between paragraphs.
      - name: showEmail
        label: Show my email address on the page
        type: boolean
      - name: interests
        label: '"I''m interested in" options'
        type: string
        list: true
        description: The dropdown choices on the form. Remove them all to hide the dropdown.
      - name: buttonText
        label: Send button text
        type: string
      - name: successMessage
        label: Message after sending
        type: string
